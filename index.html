<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="planner-container">
        <header>
            <h1>Student Study Planner</h1>
            <p>Organise your academic tasks and track your daily progress.</p>
        </header>

        <section class="task-form-section">
            <form id="taskForm">
                <div class="input-group">
                    <label for="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle" placeholder="e.g., Complete Java assignment" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="subjectName">Subject / Course Name</label>
                    <input type="text" id="subjectName" placeholder="e.g., CPS 104 B / Java Programming" autocomplete="off">
                </div>
                <button type="submit" id="addBtn">Add Task</button>
            </form>
            <p id="errorMsg" class="error-msg" aria-live="polite"></p>
        </section>

        <section class="task-list-section">
            <h2>Your Study Tasks</h2>
            <div id="taskList" class="task-list">
                <!-- Dynamically rendered tasks or empty state message -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
