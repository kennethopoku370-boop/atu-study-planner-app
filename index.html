<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATU Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="planner-container">
        <!-- Header -->
        <header class="header">
            <h1>ATU STUDY PLANNER</h1>
            <p>Organise Your Task</p>
            <span class="year-badge">2026</span>
        </header>

        <!-- Task Input Section -->
        <section class="card input-card">
            <h3>Add New Study Task</h3>
            <form id="task-form">
                <div class="form-row">
                    <input type="text" id="task-title" placeholder="Task Title * e.g. Information Tech" required>
                    <input type="text" id="task-course" placeholder="Subject e.g. IT 101" required>
                </div>
                <div class="form-row">
                    <select id="task-priority">
                        <option value="Normal">Normal Priority</option>
                        <option value="High">High Priority</option>
                        <option value="Low">Low Priority</option>
                    </select>
                    <input type="date" id="task-date">
                    <button type="submit" id="add-btn">Add Task +</button>
                </div>
            </form>
        </section>

        <!-- Search & Filter Bar -->
        <section class="card search-card">
            <div class="search-row">
                <input type="text" id="search-input" placeholder="Search by title, subject, High / Low / Normal...">
                <button type="button" id="clear-search-btn">Clear</button>
            </div>
        </section>

        <!-- Filter Tabs & Actions -->
        <section class="filter-actions-row">
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button id="clear-completed-btn">Clear Completed</button>
        </section>

        <!-- Task List Display -->
        <section class="task-list-container">
            <ul id="task-list"></ul>
            <p id="empty-msg" class="empty-msg">No tasks yet. Add your first task above! Tasks stay even after refresh.</p>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
